services:
  postgres:
    image: postgres:16-alpine
    container_name: burmalda-db
    environment:
      POSTGRES_USER: zov
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: burmalda
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
